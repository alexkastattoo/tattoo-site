<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><title>Alex Kas Studio — Calendar Prototype</title><style>*{box-sizing:border-box}body{font:15px system-ui,-apple-system,sans-serif;background:#f6f6f5;color:#222;margin:0}header{background:#171717;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:19px;margin:0}main{max-width:950px;margin:auto;padding:22px}button,input,select,textarea{font:inherit}button{border:1px solid #ccc;background:white;padding:10px 14px;border-radius:9px;cursor:pointer}button.primary{background:#171717;color:white;border-color:#171717}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar>div{display:flex;gap:7px;align-items:center}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;font-size:12px;color:#666;padding:10px 0}.day{min-height:100px;background:white;border:1px solid #e2e2e2;border-radius:8px;padding:8px;overflow:hidden;cursor:pointer}.day.muted{background:#eee;color:#999}.day.today{outline:2px solid #222}.date{font-weight:650;margin-bottom:6px}.event{background:#e8e8e8;border-radius:5px;padding:5px;margin:3px 0;font-size:11px;overflow-wrap:anywhere}.event.consultation{background:#e4edff}.event.session{background:#e5f1e8}.event.other{background:#f1e9dc}dialog{border:0;border-radius:14px;padding:24px;width:min(95vw,480px);box-shadow:0 20px 80px #0004}dialog::backdrop{background:#0007}form{display:grid;gap:12px}label{display:grid;gap:5px;font-size:13px}input,select,textarea{width:100%;border:1px solid #ccc;border-radius:8px;padding:10px;background:white}.actions{display:flex;justify-content:flex-end;gap:8px}.hint{color:#666;font-size:13px;line-height:1.5}.list{margin-top:20px} .item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;background:white;border:1px solid #ddd;border-radius:8px;margin:7px 0}.item small{color:#666}@media(max-width:600px){main{padding:12px}.day{min-height:72px;padding:4px}.event{font-size:9px;padding:3px}.date{font-size:12px}header{padding:14px}.weekday{font-size:10px}}</style></head><body><header><h1>Alex Kas Studio</h1><span style="font-size:12px">Calendar · Local prototype</span></header><main><div class="toolbar"><div><button id="prev" aria-label="Previous month">‹</button><strong id="month"></strong><button id="next" aria-label="Next month">›</button></div><div><button id="export">Export backup</button><button id="importBtn">Import backup</button><input id="importFile" type="file" accept="application/json" hidden><button class="primary" id="add">+ Booking</button></div></div><div class="calendar" id="calendar"></div><p class="hint">Times are stored exactly as entered, with no automatic time-zone conversion. This first prototype saves data only in this browser, not in the cloud. Export backups regularly; clearing browser data may erase entries.</p><section class="list"><h2 style="font-size:17px">Upcoming bookings</h2><div id="upcoming"></div></section></main><dialog id="dialog"><form id="form"><h2 style="margin:0;font-size:20px">Booking</h2><input type="hidden" id="id"><label>Client name<input id="client" required maxlength="120"></label><label>Date<input id="date" type="date" required></label><label>Time<input id="time" type="time" required value="10:00"></label><label>Type<select id="type"><option value="session">Tattoo session</option><option value="consultation">Consultation</option><option value="other">Other</option></select></label><label>Phone / Instagram<input id="contact" maxlength="150"></label><label>Deposit received (CAD)<input id="deposit" type="number" min="0" step="0.01" value="0"></label><label>Notes<textarea id="notes" rows="3"></textarea></label><div class="actions"><button type="button" id="delete" style="margin-right:auto">Delete</button><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog><script>
const KEY='alex-kas-studio-bookings-v1';let bookings=[];try{bookings=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(bookings))bookings=[]}catch{bookings=[]}const $=id=>document.getElementById(id);let view=new Date();view.setDate(1);const pad=n=>String(n).padStart(2,'0');const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const save=()=>{localStorage.setItem(KEY,JSON.stringify(bookings));render()};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function edit(b,date){$('form').reset();$('id').value=b?.id||'';$('client').value=b?.client||'';$('date').value=b?.date||date||iso(new Date());$('time').value=b?.time||'10:00';$('type').value=b?.type||'session';$('contact').value=b?.contact||'';$('deposit').value=b?.deposit??0;$('notes').value=b?.notes||'';$('delete').hidden=!b;$('dialog').showModal()}function render(){$('month').textContent=view.toLocaleDateString('en-CA',{month:'long',year:'numeric'});const first=new Date(view.getFullYear(),view.getMonth(),1);const offset=(first.getDay()+6)%7;const start=new Date(first);start.setDate(1-offset);let html=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let day=iso(d),events=bookings.filter(b=>b.date===day).sort((a,b)=>a.time.localeCompare(b.time));html+=`<div class="day ${d.getMonth()!==view.getMonth()?'muted':''} ${day===iso(new Date())?'today':''}" data-date="${day}"><div class="date">${d.getDate()}</div>${events.map(b=>`<div class="event ${esc(b.type)}" data-id="${esc(b.id)}">${esc(b.time)} ${esc(b.client)}</div>`).join('')}</div>`}$('calendar').innerHTML=html;let upcoming=bookings.filter(b=>b.date>=iso(new Date())).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,15);$('upcoming').innerHTML=upcoming.length?upcoming.map(b=>`<div class="item"><div><strong>${esc(b.client)}</strong><br><small>${esc(b.date)} · ${esc(b.time)} · ${esc(b.type)} · Deposit $${Number(b.deposit||0).toFixed(2)}</small></div><button data-edit="${esc(b.id)}">Edit</button></div>`).join(''):'<p class="hint">No upcoming bookings yet.</p>'}document.addEventListener('click',e=>{const event=e.target.closest('[data-id]');if(event){e.stopPropagation();edit(bookings.find(b=>b.id===event.dataset.id));return}const day=e.target.closest('[data-date]');if(day){edit(null,day.dataset.date);return}const btn=e.target.closest('[data-edit]');if(btn)edit(bookings.find(b=>b.id===btn.dataset.edit))});$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};$('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};$('add').onclick=()=>edit(null);$('cancel').onclick=()=>$('dialog').close();$('form').onsubmit=e=>{e.preventDefault();const id=$('id').value||('b'+Date.now()+Math.random().toString(36).slice(2));const b={id,client:$('client').value.trim(),date:$('date').value,time:$('time').value,type:$('type').value,contact:$('contact').value.trim(),deposit:Number($('deposit').value)||0,notes:$('notes').value};if(!b.client)return;bookings=bookings.filter(x=>x.id!==id);bookings.push(b);view=new Date(b.date+'T12:00:00');view.setDate(1);save();$('dialog').close()};$('delete').onclick=()=>{if(confirm('Delete this booking?')){bookings=bookings.filter(b=>b.id!==$('id').value);save();$('dialog').close()}};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),bookings},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='alex-kas-studio-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.bookings)||!data.bookings.every(b=>typeof b.id==='string'&&typeof b.client==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(b.date)&&/^\d{2}:\d{2}$/.test(b.time)))throw Error('Invalid backup');if(confirm('Replace all local bookings with this backup?')){bookings=data.bookings;save()}}catch(err){alert('Could not import: '+err.message)}e.target.value=''};render();</script></body></html>
